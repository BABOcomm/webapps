    /* OVERLAY / BACKDROP */
    div.backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: 997;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }

    div.backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    div.open-button:hover {
      cursor: pointer;
      opacity: 1;
    }

    div.panel {
      position: fixed;
      z-index: 998;
      top: 0; right: 0; bottom: 0;
      width: 800px;
      height: 100%;
      max-width: 90%;
      background-color: #f3f3f3;
      transform: translateX(100%);
      transition: transform 0.3s ease-in-out;
      box-shadow: 0px 0px 10px 0px rgba(127,127,127,0.5);
    }

    div.panel.open {
      transform: translateX(0);
    }

    .panel .panel-content {
      padding: 90px 20px 20px;
    }

    article {
      margin: 0px auto;
      padding: 25px 50px 25px;
      max-width: 1200px;
    }

    hr {
      height: 1px;
      width: 100%;
      border: none;
      border-top: 1px dashed #999;
      background-color: transparent;
    }

    a, a:visited {
      text-decoration: underline;
      color: inherit;
    }

    a:hover {
      text-decoration: none;
      color: var(--BA-roze);
    }

    strong {
      font-weight: 600;
    }

    p {
      line-height: 1.6;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 3em;
      font-weight: 400;
      padding-bottom: 20px;
    }

    /* SPECIFIEKE STYLING VOOR DE WEBAPP BLOKKEN */
    .webapp-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 40px 0;
      width: 100%;
    }

    .webapp-container > a {
      width: 80%;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .webapp-block {
      width: 100%;
      padding: 18px 25px;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
      font-weight: 600;
      font-size: 1.2em;
      box-sizing: border-box;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .webapp-block:hover {
      transform: translateY(-3px);
      border-color: var(--BA-roze);
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* CONTAINER VOOR HET ICOON */
    .webapp-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      min-width: var(--icon-size);
      margin-right: 20px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      flex-shrink: 0;
    }

    /* TEKST IN HET MIDDEN VAN HET RESTERENDE BLOK */
    .webapp-text {
      flex-grow: 1;

    /* ANIMATIE */
    .slideInLeft {
      -webkit-animation-name: slideInLeft;
      animation-name: slideInLeft;
      -webkit-animation-duration: 3s;
      animation-duration: 3s;
      -webkit-animation-fill-mode: both;
      animation-fill-mode: both;
    }

    @-webkit-keyframes slideInLeft {
      0% {
        -webkit-transform: translateX(-500%) scale(1.5);
        transform: translateX(-500%) scale(1.5);
        visibility: visible;
      }
      100% {
        -webkit-transform: translateX(0);
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      0% {
        -webkit-transform: translateX(-500%) scale(1.5);
        transform: translateX(-500%) scale(1.5);
        visibility: visible;
      }
      100% {
        -webkit-transform: translateX(0);
        transform: translateX(0);
      }
    }

  <script>
    function togglePanel() {
      document.querySelector('.panel').classList.toggle('open');
      document.querySelector('.open-button').classList.toggle('open');
      document.querySelector('.backdrop').classList.toggle('open');
    }

    function closePanel() {
      document.querySelector('.panel').classList.remove('open');
      document.querySelector('.open-button').classList.remove('open');
      document.querySelector('.backdrop').classList.remove('open');
    }

    // Sluit het zijpaneel wanneer de Escape-toets wordt ingedrukt
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closePanel();
      }
    });
  </script>
